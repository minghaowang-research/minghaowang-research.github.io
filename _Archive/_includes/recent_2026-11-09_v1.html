{% include base_path %}
<ul class="papers recent">
  {% for p in site.data.papers limit: 3 %}
  <li class="pub">
    <p class="pub-title">{{ p.title }}</p>
    <p class="pub-authors">{{ p.authors | markdownify | remove: "<p>" | remove: "</p>" | strip }} ({{ p.year }}). <span class="pub-status">{{ p.status }}</span></p>
  </li>
  {% endfor %}
</ul>
<p><a href="{{ base_path }}/research/">All research, talks, and service</a></p>
